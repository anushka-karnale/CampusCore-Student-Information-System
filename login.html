
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusCore | Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-container">

    <!-- LEFT BRAND SECTION -->

    <div class="login-brand">

        <div class="brand-icon">
            🎓
        </div>

        <h1>CampusCore</h1>

        <h2>
            Student Information<br>
            Management System
        </h2>

        <p>
            A centralized platform to manage student
            information, academic records and documents.
        </p>

        <div class="brand-line"></div>

        <span>
            Smart • Secure • Simple
        </span>

    </div>


    <!-- RIGHT LOGIN SECTION -->

    <div class="login-section">

        <!-- HEADER -->

        <div class="login-header">

            <h2>Welcome Back</h2>

            <p>
                Select your account type to continue
            </p>

        </div>


        <!-- ROLE SELECTION -->

        <div class="role-selection">

            <!-- ADMIN -->

            <button type="button"
                    class="role-btn {% if role == 'admin' %}active{% endif %}"
                    onclick="showLogin('admin', this)">

                <span>👑</span>

                <div>

                    <strong>Admin</strong>

                    <small>
                        System Administrator
                    </small>

                </div>

            </button>


            <!-- FACULTY -->

            <button type="button"
                    class="role-btn {% if role == 'faculty' %}active{% endif %}"
                    onclick="showLogin('faculty', this)">

                <span>👨‍🏫</span>

                <div>

                    <strong>Faculty</strong>

                    <small>
                        Faculty Member
                    </small>

                </div>

            </button>


            <!-- STUDENT -->

            <button type="button"
                    class="role-btn {% if role == 'student' %}active{% endif %}"
                    onclick="showLogin('student', this)">

                <span>👨‍🎓</span>

                <div>

                    <strong>Student</strong>

                    <small>
                        Student Portal
                    </small>

                </div>

            </button>

        </div>


        <!-- LOGIN FORM -->

        <form class="login-form"
              method="POST"
              action="{{ url_for('login') }}"
              autocomplete="off"
              id="loginForm">


            <!-- SELECTED ROLE -->

            <input type="hidden"
                   name="role"
                   id="selectedRole"
                   value="{{ role }}">


            <!-- USERNAME -->

            <label for="campuscore_username">
                Username
            </label>

            <input type="text"
                   id="campuscore_username"
                   name="username"
                   placeholder="Enter your username"
                   autocomplete="off"
                   required>


            <!-- PASSWORD -->

            <label for="campuscore_password">
                Password
            </label>

            <div class="password-box">

                <input type="password"
                       id="campuscore_password"
                       name="password"
                       placeholder="Enter your password"
                       autocomplete="new-password"
                       required>

                <button type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                        aria-label="Show or hide password">

                    👁

                </button>

            </div>


            <!-- FORM OPTIONS -->

            <div class="form-options">

                <label class="remember">

                    <input type="checkbox"
                           name="remember">

                    <span>
                        Remember me
                    </span>

                </label>


                <a href="{{ url_for('forgot_password') }}">
                    Forgot Password?
                </a>

            </div>


            <!-- LOGIN BUTTON -->

            <button type="submit"
                    class="login-btn">

                Login

            </button>

        </form>


       

    </div>

</div>


<!-- JAVASCRIPT -->

<script>

/* ROLE SELECTION */

function showLogin(role, button) {

    const roleInput =
        document.getElementById("selectedRole");

    const usernameInput =
        document.getElementById("campuscore_username");

    const passwordInput =
        document.getElementById("campuscore_password");


    /* Set selected role */

    if (roleInput) {
        roleInput.value = role;
    }


    /* Remove active state */

    document.querySelectorAll(".role-btn").forEach(
        function(btn) {

            btn.classList.remove("active");

        }
    );


    /* Activate selected role */

    if (button) {
        button.classList.add("active");
    }


    /* Clear username */

    if (usernameInput) {
        usernameInput.value = "";
    }


    /* Clear password */

    if (passwordInput) {

        passwordInput.value = "";
        passwordInput.type = "password";

    }

}


/* PASSWORD SHOW / HIDE */

function togglePassword() {

    const passwordInput =
        document.getElementById("campuscore_password");


    if (!passwordInput) {
        return;
    }


    if (passwordInput.type === "password") {

        passwordInput.type = "text";

    }

    else {

        passwordInput.type = "password";

    }

}


/* CLEAR LOGIN FORM */

window.addEventListener("pageshow", function() {

    const usernameInput =
        document.getElementById("campuscore_username");

    const passwordInput =
        document.getElementById("campuscore_password");


    if (usernameInput) {
        usernameInput.value = "";
    }


    if (passwordInput) {

        passwordInput.value = "";
        passwordInput.type = "password";

    }

});


/* REMOVE OLD ERROR QUERY FROM BROWSER HISTORY */

window.addEventListener("load", function() {

    const currentURL =
        new URL(window.location.href);


    if (currentURL.searchParams.has("error")) {

        currentURL.searchParams.delete("error");

        window.history.replaceState(
            {},
            document.title,
            currentURL.pathname +
            currentURL.search
        );

    }

});

</script>

</body>

</html>
