<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Faculty Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #263238;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .login-card {
            width: 100%;
            max-width: 520px;
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.10);
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            margin: 0;
            color: #1f6f5b;
            font-size: 28px;
        }

        .header p {
            margin-top: 8px;
            color: #718096;
            font-size: 14px;
        }

        .faculty-info {
            background: #eef7f4;
            border-left: 4px solid #1f6f5b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .faculty-info strong {
            color: #1f6f5b;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1f6f5b;
            box-shadow: 0 0 0 3px rgba(31, 111, 91, 0.10);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 50px;
        }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 18px;
        }

        .error {
            background: #fff1f2;
            color: #be123c;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 14px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border-radius: 9px;
            text-decoration: none;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 15px;
        }

        .save-btn {
            background: #1f6f5b;
            color: white;
        }

        .save-btn:hover {
            background: #185747;
        }

        .cancel-btn {
            background: #e5e7eb;
            color: #374151;
        }

        .cancel-btn:hover {
            background: #d1d5db;
        }

    </style>

</head>


<body>

<div class="page">

    <div class="login-card">

        <div class="header">

            <h1>Create Faculty Login</h1>

            <p>
                Create username and password for an existing faculty member.
            </p>

        </div>


        <div class="faculty-info">

            <strong>Faculty:</strong>
            {{ faculty["name"] }}

            <br>

            <strong>Email:</strong>
            {{ faculty["email"] or "Not available" }}

            <br>

            <strong>Department:</strong>
            {{ faculty["department"] or "Not available" }}

        </div>


        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <div class="buttons">

                <a
                    href="{{ url_for('view_faculty') }}"
                    class="btn cancel-btn"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn save-btn"
                >
                    Create Login
                </button>

            </div>

        </form>

    </div>

</div>


<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>

</body>

</html>
