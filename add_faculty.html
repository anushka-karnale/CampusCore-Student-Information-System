<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CampusCore | Add Faculty</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7f6;
            color: #26332f;
        }

        /* ==================================================
           SIDEBAR
        ================================================== */

        .admin-sidebar {
            width: 245px;
            background: #1f6f5b;
            color: white;

            padding: 25px 18px;

            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;

            overflow-y: auto;
        }

        .sidebar-brand {
            text-align: center;
            padding-bottom: 25px;

            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        .sidebar-brand .icon {
            font-size: 35px;
        }

        .sidebar-brand h2 {
            margin: 8px 0 3px;
            font-size: 22px;
        }

        .sidebar-brand span {
            font-size: 12px;
            opacity: 0.8;
        }

        /* ==================================================
           SIDEBAR MENU
        ================================================== */

        .sidebar-menu {
            margin-top: 28px;
        }

        .sidebar-menu a {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 13px 14px;
            margin-bottom: 7px;

            color: white;
            text-decoration: none;

            border-radius: 8px;
            font-size: 14px;

            transition: 0.2s ease;
        }

        .sidebar-menu a:hover,
        .sidebar-menu a.active {
            background: rgba(255,255,255,0.15);
        }

        .sidebar-menu .logout {
            margin-top: 25px;
            background: rgba(0,0,0,0.12);
        }

        /* ==================================================
           MAIN CONTENT
        ================================================== */

        .faculty-page {
            margin-left: 245px;
            width: calc(100% - 245px);

            padding: 30px 35px;
        }

        /* ==================================================
           HEADER
        ================================================== */

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 28px;
        }

        .page-header p {
            margin: 6px 0 0;
            color: #718079;
            font-size: 14px;
        }

        /* ==================================================
           FORM CARD
        ================================================== */

        .form-card {
            max-width: 750px;

            background: white;

            border: 1px solid #e8eeeb;
            border-radius: 12px;

            box-shadow: 0 3px 12px rgba(0,0,0,0.05);

            padding: 30px;
        }

        /* ==================================================
           FORM
        ================================================== */

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 20px;

            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            margin-bottom: 7px;

            font-size: 14px;
            font-weight: 600;

            color: #34423d;
        }

        .form-group input,
        .form-group select {
            width: 100%;

            padding: 12px 13px;

            border: 1px solid #dce5e1;
            border-radius: 7px;

            font-size: 14px;

            outline: none;

            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #1f6f5b;

            box-shadow: 0 0 0 2px rgba(31,111,91,0.08);
        }

        /* ==================================================
           PASSWORD SHOW / HIDE
        ================================================== */

        .password-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-box input {
            width: 100%;
            padding-right: 45px;
        }

        .show-password {
            position: absolute;
            right: 10px;

            background: none;
            border: none;

            cursor: pointer;

            font-size: 18px;

            padding: 4px;

            color: #1f6f5b;
        }

        .show-password:hover {
            opacity: 0.7;
        }

        /* ==================================================
           ERROR MESSAGE
        ================================================== */

        .error-message {
            background: #fff1f1;
            color: #c0392b;

            border: 1px solid #f0caca;

            padding: 12px 14px;

            border-radius: 7px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        /* ==================================================
           BUTTONS
        ================================================== */

        .form-actions {
            display: flex;
            gap: 10px;

            margin-top: 10px;
        }

        .save-btn {
            border: none;

            padding: 12px 20px;

            background: #1f6f5b;
            color: white;

            border-radius: 8px;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }

        .save-btn:hover {
            opacity: 0.9;
        }

        .cancel-btn {
            display: inline-block;

            padding: 12px 20px;

            background: white;
            color: #1f6f5b;

            border: 1px solid #dce5e1;

            border-radius: 8px;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;
        }

        .cancel-btn:hover {
            background: #f0f6f3;
        }

        /* ==================================================
           RESPONSIVE
        ================================================== */

        @media (max-width: 700px) {

            .admin-sidebar {
                width: 70px;
                padding: 20px 10px;
            }

            .sidebar-brand h2,
            .sidebar-brand span,
            .sidebar-menu .menu-text {
                display: none;
            }

            .sidebar-brand {
                border: none;
            }

            .sidebar-menu a {
                justify-content: center;
                padding: 13px 8px;
            }

            .faculty-page {
                margin-left: 70px;
                width: calc(100% - 70px);

                padding: 20px;
            }

            .form-card {
                padding: 20px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form-group {
                margin-bottom: 20px;
            }

            .form-actions {
                flex-direction: column;
            }

            .save-btn,
            .cancel-btn {
                width: 100%;
                text-align: center;
            }
        }

    </style>

</head>

<body>

<!-- ==================================================
     SIDEBAR
================================================== -->

<aside class="admin-sidebar">

    <div class="sidebar-brand">

        <div class="icon">
            🎓
        </div>

        <h2>
            CampusCore
        </h2>

        <span>
            Admin Panel
        </span>

    </div>

    <nav class="sidebar-menu">

        <!-- DASHBOARD -->

        <a href="{{ url_for('admin_dashboard') }}">

            📊

            <span class="menu-text">
                Dashboard
            </span>

        </a>


        <!-- STUDENTS -->

        <a href="{{ url_for('view_students') }}">

            👨‍🎓

            <span class="menu-text">
                Students
            </span>

        </a>


        <!-- FACULTY -->

        <a href="{{ url_for('view_faculty') }}">

            👨‍🏫

            <span class="menu-text">
                Faculty
            </span>

        </a>


        <!-- COURSES -->

        <a href="{{ url_for('view_courses') }}">

            📚

            <span class="menu-text">
                Courses
            </span>

        </a>


        <!-- DOCUMENTS -->

        <a href="#">

            📄

            <span class="menu-text">
                Documents
            </span>

        </a>


        <!-- REPORTS -->

        <a href="#">

            📈

            <span class="menu-text">
                Reports
            </span>

        </a>


        <!-- SETTINGS -->

        <a href="#">

            ⚙️

            <span class="menu-text">
                Settings
            </span>

        </a>


        <!-- LOGOUT -->

        <a href="{{ url_for('logout') }}"
           class="logout">

            🚪

            <span class="menu-text">
                Logout
            </span>

        </a>

    </nav>

</aside>


<!-- ==================================================
     MAIN CONTENT
================================================== -->

<main class="faculty-page">

    <div class="page-header">

        <h1>
            Add Faculty
        </h1>

        <p>
            Add faculty member information to the system.
        </p>

    </div>


    <!-- ==================================================
         FORM CARD
    ================================================== -->

    <div class="form-card">

        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">


            <!-- NAME + EMAIL -->

            <div class="form-row">

                <div class="form-group">

                    <label for="name">
                        Faculty Name *
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter faculty name"
                        value="{{ name or '' }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                        value="{{ email or '' }}"
                    >

                </div>

            </div>


            <!-- PHONE + DEPARTMENT -->

            <div class="form-row">

                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        placeholder="Enter phone number"
                        value="{{ phone or '' }}"
                    >

                </div>


                <div class="form-group">

                    <label for="department">
                        Department
                    </label>

                    <input
                        type="text"
                        id="department"
                        name="department"
                        placeholder="Enter department"
                        value="{{ department or '' }}"
                    >

                </div>

            </div>


            <!-- DESIGNATION -->

            <div class="form-row">

                <div class="form-group full">

                    <label for="designation">
                        Designation
                    </label>

                    <input
                        type="text"
                        id="designation"
                        name="designation"
                        placeholder="Example: Assistant Professor"
                        value="{{ designation or '' }}"
                    >

                </div>

            </div>


            <!-- LOGIN DETAILS -->

            <div class="form-row">

                <div class="form-group">

                    <label for="username">
                        Username *
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Example: sneha.joshi"
                        value="{{ username or '' }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password *
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter login password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()"
                            title="Show/Hide Password"
                        >
                            👁️
                        </button>

                    </div>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <button
                    type="submit"
                    class="save-btn"
                >
                    ➕ Add Faculty
                </button>


                <a
                    href="{{ url_for('view_faculty') }}"
                    class="cancel-btn"
                >
                    ← Back to Faculty
                </a>

            </div>

        </form>

    </div>

</main>


<!-- ==================================================
     PASSWORD SHOW / HIDE SCRIPT
================================================== -->

<script>

function togglePassword() {

    const password =
        document.getElementById("password");

    if (password.type === "password") {

        password.type = "text";

    } else {

        password.type = "password";

    }

}

</script>


</body>

</html>
